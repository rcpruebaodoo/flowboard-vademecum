<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flowboard Vademécum</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 18px;background:#0f172a;color:#e2e8f0}.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:18px;margin:12px 0}.ok{color:#67e8f9}.muted{color:#94a3b8}a{color:#93c5fd}</style></head><body><h1>Flowboard Vademécum</h1><p class="muted">Repositorio farmacológico público. No contiene datos de pacientes.</p><div id="status" class="card">Cargando index.json…</div><div id="list"></div><script>fetch('./index.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(data=>{document.getElementById('status').innerHTML='<b class="ok">✓ Repositorio activo</b><br>Versión: '+data.version+' · Fármacos: '+data.count+' · Actualizado: '+data.updated_at;const list=document.getElementById('list');data.drugs.forEach(d=>{const el=document.createElement('div');el.className='card';el.innerHTML='<b>'+d.name+'</b><br><span class="muted">'+d.status+'</span><br><a href="'+d.file+'">'+d.file+'</a>';list.appendChild(el);})}).catch(err=>document.getElementById('status').textContent='Error: '+err.message)</script></body></html>
